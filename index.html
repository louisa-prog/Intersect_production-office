<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>INTERSECT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: INTERSECT production office — grey sidebar of events and modules, a white working sheet;
   square edges and 1px rules from the INTERSECT site, the logo's double slash as the separator.
   Palette: White ECE9E9 · Black 1D2121 · Grey CECECE, with Volt for action, Lean for selection, Heat only for alarms. */
:root{
  --paper:#FFFFFF;          /* main sheet */
  --white:#ECE9E9;          /* INTERSECT White — sidebar, panels */
  --tint:#F6F4F4;           /* table headers, wells */
  --grey:#CECECE;           /* INTERSECT Grey — rules, borders */
  --ink:#1D2121;            /* INTERSECT Black — text */
  --muted:#5C6262;          /* secondary text */
  --faint:#8A8F8F;          /* placeholders, captions */
  --volt:#B9ED00; --volt-soft:#EFFAC7; --volt-ink:#3E5200;
  --lean:#7182CB; --lean-soft:#E7EAF7; --lean-ink:#3A4994;
  --heat:#FF6716; --heat-soft:#FFE8DC; --heat-ink:#B5420A;
  --display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:2px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--display);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--lean-ink)}
:focus-visible{outline:2px solid var(--lean);outline-offset:1px}
img{max-width:100%}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}
aside{background:var(--white);border-right:1px solid var(--grey);padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:0;background:none;padding:0;text-align:left}
.brand img{width:178px;height:auto;display:block}
.brand .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:400}
.evlist{display:flex;flex-direction:column;gap:1px}
.evbtn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;border:0;background:none;padding:8px 10px 8px 12px;gap:1px;border-left:3px solid transparent}
.evbtn:hover{background:rgba(255,255,255,.6)}
.evbtn[aria-current="true"]{background:var(--paper);border-left-color:var(--volt)}
.evbtn .n{font-weight:600}
.evbtn .m{font-size:11px;color:var(--muted);font-family:var(--mono)}
.homebtn{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 10px 7px 12px;text-align:left;border-left:3px solid transparent;font-weight:500}
.homebtn:hover{background:rgba(255,255,255,.6)}
.homebtn[aria-current="true"]{background:var(--paper);border-left-color:var(--lean)}
.btn{border:1px solid var(--grey);background:var(--paper);padding:8px 14px;border-radius:var(--r);font-weight:500;display:inline-flex;align-items:center;gap:6px;letter-spacing:.01em}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:#000}
.btn.tape{background:var(--volt);color:var(--ink);border-color:var(--volt);font-weight:600}
.btn.tape:hover{border-color:var(--ink)}
.btn.danger{color:var(--heat-ink);border-color:var(--heat)}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.modnav{display:flex;flex-direction:column;gap:1px}
.modbtn{display:flex;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:6px 10px 6px 12px;width:100%;gap:8px}
.modbtn:hover{background:rgba(255,255,255,.6)}
.modbtn[aria-current="true"]{background:var(--ink);color:var(--paper)}
.modbtn .c{font-family:var(--mono);font-size:11px;opacity:.75}
.modbtn[aria-current="true"] .c{color:var(--volt);opacity:1}
.mobile-top{display:none}
main{min-width:0;padding-block:28px 72px;padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--grey)}
.head h1{font-size:38px;font-weight:700;letter-spacing:-.035em;margin:6px 0 0;text-wrap:balance;line-height:1.02}
.head .sub{color:var(--muted);margin-top:6px;font-family:var(--mono);font-size:12px}
.sl{color:var(--lean);font-weight:400;letter-spacing:-.08em;margin:0 .35em}
.tminus{font-family:var(--mono);font-weight:700;background:var(--volt);color:var(--ink);padding:7px 12px;font-size:14px;white-space:nowrap}
.tminus.past{background:var(--white);color:var(--muted)}
.banner{background:var(--lean-soft);color:var(--lean-ink);padding:9px 12px;margin-bottom:16px;font-size:13px;border-left:3px solid var(--lean)}
.banner.warn{background:var(--heat-soft);color:var(--heat-ink);border-left-color:var(--heat)}
section.block{background:var(--paper);border:1px solid var(--grey);margin-bottom:20px}
.bhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;justify-content:space-between;padding:16px 18px 12px}
.bhead h2{font-size:19px;font-weight:600;margin:0;letter-spacing:-.015em}
.bhead p{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:72ch}
.tw{overflow-x:auto;border-top:1px solid var(--grey)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:400;text-align:left;padding:9px 7px;border-bottom:1px solid var(--grey);white-space:nowrap;background:var(--tint)}
th.num{text-align:right}
td{border-bottom:1px solid #E4E2E2;padding:2px 2px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td input,td select,td textarea{width:100%;border:1px solid transparent;background:transparent;padding:6px 7px;border-radius:var(--r);min-width:0}
td input:hover,td select:hover,td textarea:hover{border-color:var(--grey)}
td input:focus,td select:focus,td textarea:focus{border-color:var(--lean);background:var(--paper);outline:none}
td input[type=number],.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
td input[type=date],td input[type=time]{font-family:var(--mono);font-size:12px}
td input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink);margin:0 auto;display:block}
td.c{text-align:center}
td.x{width:34px}
.del{border:0;background:none;color:var(--faint);width:28px;height:28px;font-size:16px;line-height:1}
.del:hover{background:var(--heat-soft);color:var(--heat-ink)}
.del.arm{background:var(--heat);color:#fff;font-size:11px;width:auto;padding:0 7px}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--grey);flex-wrap:wrap}
.tfoot .tot{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
select.pill{font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;text-align:left;background:var(--tint)}
select.pill[data-k="good"]{background:var(--volt-soft);color:var(--volt-ink)}
select.pill[data-k="info"]{background:var(--lean-soft);color:var(--lean-ink)}
select.pill[data-k="warn"]{background:var(--white);color:var(--ink)}
select.pill[data-k="bad"]{background:var(--heat-soft);color:var(--heat-ink)}
.due{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding:0 6px}
.due.late{color:var(--heat-ink);font-weight:700}
.tm{display:flex;align-items:center;gap:4px}
.tm span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tm input{width:58px}
.score{font-family:var(--mono);font-weight:700;text-align:center;padding:5px 0;display:block;min-width:38px}
.score.hi{background:var(--heat-soft);color:var(--heat-ink)}
.score.md{background:var(--lean-soft);color:var(--lean-ink)}
.score.lo{background:var(--volt-soft);color:var(--volt-ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px;padding:16px 18px 20px;border-top:1px solid var(--grey)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--grey);background:var(--paper);border-radius:var(--r);padding:9px 11px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--lean);outline:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;margin-bottom:20px;border-top:1px solid var(--grey);border-left:1px solid var(--grey)}
.stat{background:var(--paper);border-right:1px solid var(--grey);border-bottom:1px solid var(--grey);padding:15px 16px;display:flex;flex-direction:column;gap:7px;min-width:0}
.stat .v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.025em;line-height:1.05}
.stat .s{font-size:12px;color:var(--muted)}
.stat.bad .v{color:var(--heat-ink)}
.bar,.tile-bar{height:5px;background:var(--white);overflow:hidden}
.bar i,.tile-bar i{display:block;height:100%;background:var(--volt)}
.list{padding:2px 0 6px;border-top:1px solid var(--grey)}
.li{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 18px;border-bottom:1px solid #E4E2E2}
.li:last-child{border-bottom:0}
.li .k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip{font-family:var(--mono);font-size:11px;padding:2px 8px;background:var(--tint);color:var(--muted);white-space:nowrap;border:1px solid var(--grey)}
.chip.bad{background:var(--heat-soft);color:var(--heat-ink);border-color:transparent}
.chip.tape{background:var(--volt-soft);color:var(--volt-ink);border-color:transparent}
.chip.lean{background:var(--lean-soft);color:var(--lean-ink);border-color:transparent}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:16px 18px 18px;border-top:1px solid var(--grey)}
.modcard{border:1px solid var(--grey);padding:11px 12px;background:var(--paper);text-align:left;display:flex;flex-direction:column;gap:8px}
.modcard:hover{border-color:var(--ink)}
.modcard b{font-weight:600}
.modcard .s{font-size:12px;color:var(--muted)}
.empty{max-width:920px;margin:2vh 0 0;text-align:left;display:flex;flex-direction:column;gap:14px}
.empty h1{font-size:34px;letter-spacing:-.03em;margin:0;line-height:1.05}
.empty p{color:var(--muted);margin:0;max-width:62ch}
.formats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border-top:1px solid var(--grey);border-left:1px solid var(--grey)}
.fmt{border:0;border-right:1px solid var(--grey);border-bottom:1px solid var(--grey);padding:13px 14px;background:var(--paper);text-align:left;display:flex;flex-direction:column;gap:4px}
.fmt:hover{background:var(--tint)}
.fmt[aria-pressed="true"]{background:var(--volt-soft);box-shadow:inset 0 0 0 2px var(--ink)}
.fmt b{font-size:15px;font-weight:600}
.fmt span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addmods{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 15px;font-family:var(--mono);font-size:12px;opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:none}
.sync{font-size:11px;color:var(--muted);font-family:var(--mono)}
textarea.cell{min-height:34px;resize:vertical}
.calc{font-family:var(--mono);font-variant-numeric:tabular-nums;padding:0 8px;white-space:nowrap;font-size:12px}
.calc.r{text-align:right}
.custom-tag{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400}

/* module builder */
.builder{display:flex;flex-direction:column;gap:16px;max-width:920px}
.builder h1{font-size:32px;letter-spacing:-.03em;margin:0}
.builder p.lead{color:var(--muted);margin:0;max-width:68ch}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px 16px}
.brows{display:flex;flex-direction:column;gap:8px;padding:12px 18px 6px;border-top:1px solid var(--grey)}
.brow{display:grid;grid-template-columns:22px minmax(140px,1.2fr) 150px minmax(0,1.6fr) auto;gap:8px;align-items:center}
.brow .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.brow input,.brow select{border:1px solid var(--grey);background:var(--paper);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
.brow input:focus,.brow select:focus{border-color:var(--lean);outline:none}
.brow .acts{display:flex;gap:4px}

/* home */
.home{display:flex;flex-direction:column;gap:30px;max-width:1120px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px 44px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--grey)}
.hero .logo{width:min(440px,100%);height:auto;display:block}
.hero .tagline{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.hero h1{font-size:clamp(40px,5.6vw,72px);font-weight:700;letter-spacing:-.045em;line-height:.94;margin:26px 0 0;text-wrap:balance}
.hero h1 .sl{font-weight:300}
.hero .lead{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0 0 14px;max-width:34ch;color:var(--ink)}
.hero p{color:var(--muted);margin:0 0 12px;max-width:60ch;line-height:1.65}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--grey);border-left:1px solid var(--grey)}
.fact{border-right:1px solid var(--grey);border-bottom:1px solid var(--grey);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fact b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.fact span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.open{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;background:var(--white);padding:18px 20px;border-left:4px solid var(--volt)}
.open .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--volt);padding:4px 8px;white-space:nowrap}
.open p{margin:0;max-width:78ch;line-height:1.6}
.clients{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.clients b{color:var(--ink);font-weight:400}
.sec-title{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--grey)}

/* video carousel */
.reel{border:1px solid var(--grey);background:var(--paper)}
.reel-stage{position:relative;background:var(--ink);height:clamp(260px,46vw,500px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.reel-stage video{width:100%;height:100%;object-fit:contain;background:var(--ink);display:block}
.reel-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:rgba(29,33,33,.72);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:2}
.reel-nav:hover{background:var(--volt);color:var(--ink)}
.reel-nav.prev{left:12px}
.reel-nav.next{right:12px}
.reel-cap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:end;padding:14px 16px;border-top:1px solid var(--grey)}
.reel-cap b{font-size:18px;font-weight:600;letter-spacing:-.015em}
.reel-cap span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.reel-cap .count{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.reel-thumbs{display:flex;gap:8px;padding:0 16px 16px;overflow-x:auto}
.reel-thumb{flex:0 0 auto;width:132px;border:1px solid var(--grey);background:var(--tint);padding:0;text-align:left;display:flex;flex-direction:column}
.reel-thumb img,.reel-thumb .ph{width:100%;height:74px;object-fit:cover;display:block;background:var(--ink)}
.reel-thumb span{font-size:11px;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reel-thumb[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--volt)}
.reel-empty{padding:36px 18px;color:var(--muted);text-align:center;border-top:1px solid var(--grey)}
.reel-edit{display:flex;flex-direction:column;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--grey)}
.reel-edit .er{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:center}
.reel-edit input{border:1px solid var(--grey);padding:7px 9px;border-radius:var(--r);width:100%;min-width:0;background:var(--paper)}

/* archive */
.drop{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 18px 14px;padding:14px 16px;border:1px dashed var(--grey);background:var(--tint)}
.drop.over{border-color:var(--lean);background:var(--lean-soft)}
.drop p{margin:0;color:var(--muted);font-size:13px;flex:1;min-width:200px}
.drop select{border:1px solid var(--grey);padding:6px 8px;background:var(--paper);border-radius:var(--r)}
.files{border-top:1px solid var(--grey)}
.file{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 18px;border-bottom:1px solid #E4E2E2}
.file:last-child{border-bottom:0}
.kind{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:4px 0;background:var(--white);color:var(--ink)}
.kind.video{background:var(--ink);color:var(--volt)}
.kind.image{background:var(--lean-soft);color:var(--lean-ink)}
.kind.pdf{background:var(--volt-soft);color:var(--volt-ink)}
.fmeta{min-width:0;display:flex;flex-direction:column;gap:3px}
.fmeta .fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta .fd{font-family:var(--mono);font-size:11px;color:var(--muted)}
.fmeta input.note{border:1px solid transparent;background:transparent;padding:3px 5px;margin-left:-5px;font-size:12px;color:var(--muted);width:100%;max-width:520px}
.fmeta input.note:hover{border-color:var(--grey)}
.fmeta input.note:focus{border-color:var(--lean);outline:none;color:var(--ink);background:var(--paper)}
.facts-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.facts-row select{border:1px solid var(--grey);padding:4px 6px;background:var(--paper);font-size:12px;border-radius:var(--r)}
.grp{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 18px 8px;background:var(--tint);border-top:1px solid var(--grey);border-bottom:1px solid var(--grey);display:flex;justify-content:space-between}
.fileacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lightbox{position:fixed;inset:0;background:rgba(29,33,33,.9);z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img,.lightbox video{max-width:100%;max-height:100%;display:block;background:var(--ink)}

}

// Fill in any arrays or fields an older saved event is missing.
function normalise(e) {
    if (!e || typeof e !== "object") return e;
    if (!Array.isArray(e.modules)) e.modules = (FORMAT_MODULES[e.format] || MOD_ORDER).slice();
    if (!e.brief || typeof e.brief !== "object") e.brief = {};
    for (var k in TABLES) if (!Array.isArray(e[k])) e[k] = [];
    if (!Array.isArray(e.custom)) e.custom = [];
    if (!Array.isArray(e.archive)) e.archive = [];
    // Every event has an archive, including events made before it existed.
    if (e.modules.indexOf("archive") < 0) {
        var w = e.modules.indexOf("wrap");
        if (w < 0) e.modules.push("archive"); else e.modules.splice(w, 0, "archive");
    }
    e.custom.forEach(function (c) { if (!Array.isArray(e[c.id])) e[c.id] = []; });
    if (e.debrief === undefined) e.debrief = "";
    if (!e.currency) e.currency = "EUR";
    return e;
}

// ---------- overview figures ----------
function sumCol(ev, key, field) {
    var rs = ev[key] || [], s = 0;
    for (var i = 0; i < rs.length; i++) s += num(rs[i][field]);
    return s;
}
function dueOf(ev, m) { return ev.startDate ? addDays(ev.startDate, -7 * (Number(m.t) || 0)) : ""; }

function overviewStats(ev) {
    var cur = ev.currency, out = [];
    var ms = ev.milestones || [];
    var done = ms.filter(function (m) { return m.status === "Done"; }).length;
    var late = ms.filter(function (m) { var d = dueOf(ev, m); return m.status !== "Done" && d && dayDiff(d) < 0; }).length;
    out.push({ label: "Milestones", value: done + " / " + ms.length, sub: late ? late + " overdue" : "None overdue", bad: late > 0, bar: ms.length ? done / ms.length : 0 });
    var cont = (num(ev.brief && ev.brief.contPct) || 0) / 100;
    var inc = sumCol(ev, "income", "est"), cost = sumCol(ev, "costs", "est") * (1 + cont);
    out.push({ label: "Projected result", value: money(inc - cost, cur), sub: money(inc, cur) + " in · " + money(cost, cur) + " out incl. contingency", bad: inc - cost < 0 });
    var on = function (m) { return ev.modules.indexOf(m) >= 0; };
    if (on("sponsors")) {
        var sp = (ev.sponsors || []).filter(function (s) { return s.stage === "Signed" || s.stage === "Paid"; });
        out.push({ label: "Partners signed", value: String(sp.length), sub: money(sp.reduce(function (s, x) { return s + num(x.fee); }, 0), cur) + " committed of " + (ev.sponsors || []).length + " in pipeline" });
    }
    var hi = (ev.risks || []).filter(function (r) { return riskScore(r) >= 12; }).length;
    out.push({ label: "High risks", value: String(hi), sub: "Scored 12 or above", bad: hi > 0 });
    if (on("registration")) {
        var tk = ev.tickets || [], sold = sumCol(ev, "tickets", "sold"), cap = sumCol(ev, "tickets", "cap");
        out.push({ label: "Tickets sold", value: count(sold) + (cap ? " / " + count(cap) : ""), sub: money(tk.reduce(function (s, r) { return s + rowPrice(r); }, 0), cur) + " ticket revenue", bar: cap ? Math.min(1, sold / cap) : -1 });
    }
    if (on("guests")) {
        var g = ev.guests || [];
        var yes = g.filter(function (x) { return x.rsvp === "Yes"; }).length, inv = g.filter(function (x) { return x.invited; }).length;
        var pend = g.filter(function (x) { return x.invited && (!x.rsvp || x.rsvp === "Pending"); }).length;
        out.push({ label: "Guests confirmed", value: yes + " / " + inv, sub: pend + " invited and awaiting reply" });
    }
    if (on("cfp")) {
        var cf = ev.cfp || [];
        out.push({ label: "Speakers accepted", value: String(cf.filter(function (x) { return x.status === "Accepted"; }).length), sub: "from " + cf.length + " submissions" });
    }
    if (on("stakeholders")) {

        out.push({ label: "Approvals open", value: String(pa), sub: (ap.length - pa) + " of " + ap.length + " signed off" });
    }
    if (on("measurement")) {
        var withT = (ev.metrics || []).filter(function (x) { return num(x.target) > 0; });
        var hit = withT.filter(function (x) { return num(x.actual) >= num(x.target); }).length;
        out.push({ label: "Metrics on target", value: hit + " / " + withT.length, sub: withT.length ? "Metrics with a target set" : "Set targets in Data & measurement" });
    }
    if (on("staffing")) {
        var sf = ev.staffing || [];

    }
    if (on("teams")) {

        out.push({ label: "Teams", value: String(tm.length), sub: sub + " submitted · " + (ev.hackers || []).length + " registrations" });
    }
    if (on("prizes")) {
        var pz = ev.prizes || [], paid = pz.filter(function (x) { return x.paid; }).length;
        out.push({ label: "Prize pool", value: money(sumCol(ev, "prizes", "amount"), cur), sub: paid + " of " + pz.length + " paid out" });
    }
    if (on("streaming")) {
        var tc = ev.techChecks || [];
        out.push({ label: "Speaker tech checks", value: tc.filter(function (x) { return x.status === "Done"; }).length + " / " + tc.length, sub: "Checked on the live platform" });

    if (on("vod")) {

        var avg = held.length ? Math.round(held.reduce(function (s, x) { return s + num(x.attended); }, 0) / held.length) : 0;

        out.push({ label: "Raised", value: money(rec, cur), sub: money(sumCol(ev, "donors", "pledged"), cur) + " pledged · " + money(ask, cur) + " asked", bar: ask ? Math.min(1, rec / ask) : -1 });
    }
    return out;
}

/* ---------- writes ---------- */
function patch(id,fields){
  var e=S.events[id];if(!e)return;
  Object.keys(fields).forEach(function(k){e[k]=fields[k]});
  if(S.mode!=="db"||S.readOnly)return;
  S.pending[id]=Object.assign(S.pending[id]||{},fields);
  clearTimeout(S.timers[id]);S.timers[id]=setTimeout(function(){flush(id)},650);
}
function flush(id){
  if(S.writing[id]){S.timers[id]=setTimeout(function(){flush(id)},300);return}
  var f=S.pending[id];if(!f)return;delete S.pending[id];
  f.updatedAt=new Date().toISOString();S.inflight[id]=f;S.writing[id]=true;setSync("Saving…");
  S.db.collection("events").doc(id).update(f).then(function(){S.writing[id]=false;delete S.inflight[id];setSync("Saved")},function(err){
    S.writing[id]=false;delete S.inflight[id];
    if(err&&err.code==="invalid_argument"){S.readOnly=true;setSync("View only");render();toast("You can view this office but not edit it")}
    else if(err&&err.code==="unavailable"){S.pending[id]=Object.assign(f,S.pending[id]||{});setTimeout(function(){flush(id)},800+Math.random()*800)}
    else{setSync("Not saved");toast("Change not saved: "+(err&&err.message||"try again"))}
  });
}
function setSync(t){var el=document.getElementById("sync");if(el)el.textContent=t}
// Patch and write straight away (used right after an upload, so the file is never left without its record).
function patchNow(id,fields){patch(id,fields);if(S.mode==="db"&&!S.readOnly){clearTimeout(S.timers[id]);flush(id)}}

function patchCustom(id){var e=S.events[id],f={custom:e.custom,modules:e.modules};(e.custom||[]).forEach(function(c){f[c.id]=e[c.id]||[]});patch(id,f)}

function readBuf(file){
  if(file.arrayBuffer)return file.arrayBuffer();
  return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.readAsArrayBuffer(file)});
}
function toB64(buf){var b=new Uint8Array(buf),out="",CH=0x8000;for(var i=0;i<b.length;i+=CH)out+=String.fromCharCode.apply(null,b.subarray(i,i+CH));return btoa(out)}
function fromB64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function uploadFiles(files,mod){
  if(!canUpload()){toast("Only people who can edit this office can add files");return}
  var list=Array.prototype.slice.call(files||[]);if(!list.length)return;
  var id=S.cur;S.uploading+=list.length;render();
  var chain=Promise.resolve(),added=0,failed=[];
  list.forEach(function(file){chain=chain.then(function(){return uploadOne(file,mod,id).then(function(ok){if(ok)added++;else failed.push(file.name)})})});
  chain.then(function(){S.uploading=0;render();
    if(failed.length)toast(failed.length===1?failed[0]+" wasn't added":failed.length+" files weren't added");
    else toast(added===1?"File added to the archive":added+" files added to the archive")});
}
function uploadOne(file,mod,id){
  var ext=String(file.name).toLowerCase().split(".").pop(),native=NATIVE_TYPES[ext];
  function record(res,wrapped){
    var e=S.events[id];if(!e)return true;
    var item={id:rid(),module:mod,name:file.name,size:file.size,type:file.type||native||"",assetId:res.id,url:res.url||("/_blob/"+res.id),wrapped:!!wrapped,addedAt:new Date().toISOString(),note:""};
    patchNow(id,{archive:(e.archive||[]).concat([item])});
    return true;
  }
  function fail(err,limitMsg){toast(limitMsg||explain(err,file.name));return false}
  function wrap(){
    if(file.size>MAX_WRAPPED)return Promise.resolve(fail(null,file.name+" is over 14 MB, the web limit for this file type"));
    return readBuf(file).then(function(buf){
      var json=JSON.stringify({format:"intersect-archive/1",name:file.name,type:file.type||"",size:file.size,data:toB64(buf)});
      return S.assets.upload(new Blob([json],{type:"application/json"}),{type:"application/json"}).then(function(r){return record(r,true)},function(err){return fail(err)});
    });
  }
  if(native){
    if(file.size>MAX_NATIVE)return Promise.resolve(fail(null,file.name+" is over 20 MB, the web upload limit"));
    return S.assets.upload(file,{type:native}).then(function(r){return record(r,false)},function(err){
      // A text file that isn't UTF-8 is refused as text; keep it as a wrapped file instead.
      if(err&&(err.code==="invalid_request"||err.code==="unsupported_type")&&/^text\/|json/.test(native))return wrap();
      return fail(err)});
  }
  return wrap();
}
function explain(err,name){
  var c=err&&err.code;
  if(c==="too_large")return name+" is too large for the web archive";
  if(c==="quota_or_state")return "The archive is full. Delete files you no longer need";
  if(c==="rate_limited")return "Too many uploads at once. Try again in a moment";
  if(c==="not_granted"||c==="capability_disabled")return "Uploading isn't available here";
  return "Couldn't add "+name+(err&&err.message?": "+err.message:"");
}
function findFile(fid){var e=ev();return (e&&e.archive||[]).filter(function(x){return x.id===fid})[0]}
function saveFile(f){
  if(!S.downloads){toast("Saving files isn't available in this view");return}
  fetch(f.url).then(function(res){if(!res.ok)throw new Error("missing");return f.wrapped?res.json().then(function(j){return fromB64(j.data).buffer}):res.blob()})
  .then(function(data){return S.downloads.save({filename:f.name,data:data})})
  .catch(function(err){var c=err&&err.code;
    if(c==="declined")return;
    if(c==="rejected_extension"||c==="extension_not_enabled")toast("This file type can't be saved from the web page. Open it in the INTERSECT Basecamp app");
    else if(err&&err.message==="missing")toast("That file is no longer in the store");
    else toast("Couldn't save "+f.name)});
}

  function drop(){patchNow(id,{archive:(S.events[id].archive||[]).filter(function(x){return x.id!==f.id})});render();toast("File deleted")}

  S.builder=def?{id:id,title:def.title,lead:def.lead||"",rows:builderRows(def.cols)}:{id:"",title:"",lead:"",rows:[{label:"Item",type:"text"},{label:"Owner",type:"text"},{label:"Due",type:"date"},{label:"Status",type:"status"}]};
  S.panel="builder";S.armed=null;render();window.scrollTo(0,0);
}
document.addEventListener("input",function(evt){var t=evt.target;if(S.readOnly)return;
  if(t.dataset.an){var e0=ev();patch(S.cur,{archive:(e0.archive||[]).map(function(x){return x.id===t.dataset.an?Object.assign({},x,{note:t.value}):x})});return}
  if(t.dataset.sc){var it=showcaseItems().map(function(x){return Object.assign({},x)});it[+t.dataset.i][t.dataset.sc]=t.value;S.showcase={items:it};clearTimeout(S.scTimer);S.scTimer=setTimeout(writeShowcase,700);var cap=document.querySelector("#reel-home .reel-cap");if(cap&&(S.reel.home||0)===+t.dataset.i){S.reelItems.home=it.map(function(x){return {title:x.title,caption:x.caption,url:x.url,poster:x.poster}})}return}
  if(t.dataset.bf&&S.builder){S.builder[t.dataset.bf]=t.value;return}
  if(t.dataset.bi!==undefined&&S.builder&&t.dataset.bk!=="type"){S.builder.rows[+t.dataset.bi][t.dataset.bk]=t.value;return}
  if(t.dataset.t&&t.dataset.c)setCell(t);else if(t.dataset.k&&t.dataset.scope)setField(t)});
document.addEventListener("change",function(evt){var t=evt.target;if(t.id==="mev"){if(!t.value)return;S.cur=t.value;S.creating=false;S.panel="";S.mod="overview";remember();render();return}if(S.readOnly)return;
  if(t.dataset.up){var mod=t.dataset.up==="*"?S.archMod:t.dataset.up;uploadFiles(t.files,mod);t.value="";return}
  if(t.id==="sc-add"){addShowcaseVideos(t.files);t.value="";return}
  if(t.dataset.archsel){S.archMod=t.value;return}
  if(t.dataset.am){var e1=ev();patchNow(S.cur,{archive:(e1.archive||[]).map(function(x){return x.id===t.dataset.am?Object.assign({},x,{module:t.value}):x})});render();toast("File moved");return}
  if(t.dataset.sc){render();return}
  if(t.dataset.bi!==undefined&&S.builder&&t.dataset.bk==="type"){S.builder.rows[+t.dataset.bi].type=t.value;render();return}
  if(t.dataset.t&&t.dataset.c){setCell(t);render()}else if(t.dataset.k&&t.dataset.scope){setField(t);render()}});
document.addEventListener("click",function(evt){
  var b=evt.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,e=ev();
  if(a!=="delrow"&&a!=="armevent"&&a!=="bdelete"&&a!=="fdel"&&a!=="scdel")S.armed=null;
  if(a==="home"){S.panel="home";S.creating=false;remember();render();window.scrollTo(0,0)}
  else if(a==="fmtstart"){if(S.readOnly)return;S.newFmt=b.dataset.f;S.creating=true;render();window.scrollTo(0,0)}
  else if(a==="reel"){reelGo(b.dataset.p,(S.reel[b.dataset.p]||0)+(+b.dataset.d))}
  else if(a==="reelgo"){reelGo(b.dataset.p,+b.dataset.i)}
  else if(a==="scedit"){S.showEdit=!S.showEdit;render()}
  else if(a==="scmove"){var li=showcaseItems().slice(),i0=+b.dataset.i,j0=i0+(+b.dataset.d);if(j0>=0&&j0<li.length){var t0=li[i0];li[i0]=li[j0];li[j0]=t0;setShowcase(li)}}
  else if(a==="scdel"){var k0="sc"+b.dataset.i;if(S.armed!==k0){S.armed=k0;render();return}S.armed=null;var l2=showcaseItems().slice(),gone=l2.splice(+b.dataset.i,1)[0];if(gone&&gone.assetId&&S.assets)S.assets.delete(gone.assetId).catch(function(){});S.reel.home=0;setShowcase(l2);toast("Video removed from the carousel")}
  else if(a==="fview"){var fv=findFile(b.dataset.id);if(fv){S.lightbox={kind:fileKind(fv.name,fv.type),url:fv.url,name:fv.name};renderLightbox()}}
  else if(a==="lbclose"){S.lightbox=null;renderLightbox()}
  else if(a==="fsave"){var fs=findFile(b.dataset.id);if(fs)saveFile(fs)}
  else if(a==="fdel"){var fd=findFile(b.dataset.id);if(!fd)return;if(S.armed!=="f"+fd.id){S.armed="f"+fd.id;render();return}S.armed=null;deleteFile(fd)}
  else if(a==="pick"){S.cur=b.dataset.id;S.creating=false;S.panel="";S.mod="overview";remember();render();window.scrollTo(0,0)}
  else if(a==="mod"){S.mod=b.dataset.m;S.panel="";remember();render();window.scrollTo(0,0)}
  else if(a==="new"){S.creating=true;render();window.scrollTo(0,0)}
  else if(a==="cancelnew"){S.creating=false;render()}
  else if(a==="fmt"){S.newFmt=b.dataset.f;document.querySelectorAll(".fmt").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.f===S.newFmt)})}
  else if(a==="create"||a==="example"){
    var data=a==="example"?exampleEvent():newEvent({format:S.newFmt,name:(document.getElementById("nn").value||"").trim()||"Untitled "+FORMATS[S.newFmt].label.toLowerCase(),startDate:document.getElementById("nd").value,city:(document.getElementById("nc").value||"").trim()});
    createEvent(data);
  }
  else if(a==="addrow"){var k=b.dataset.t,t=tableOf(e,k),r=blankRow(k,e),f={};f[k]=(e[k]||[]).concat([r]);patch(S.cur,f);render();var el=document.getElementById(S.cur+"-"+k+"-"+r.id+"-"+t.cols[0][0]);if(el)el.focus()}
  else if(a==="delrow"){var key=b.dataset.t+b.dataset.r;if(S.armed!==key){S.armed=key;render();return}S.armed=null;var f2={};f2[b.dataset.t]=(e[b.dataset.t]||[]).filter(function(x){return x.id!==b.dataset.r});patch(S.cur,f2);render();toast("Row deleted")}
  else if(a==="addmod"){var mods=e.modules.concat([b.dataset.m]).sort(modSort);patch(S.cur,{modules:mods});S.mod=b.dataset.m;render()}
  else if(a==="hidemod"){patch(S.cur,{modules:e.modules.filter(function(m){return m!==b.dataset.m})});S.mod="overview";render();toast("Module hidden · data kept")}
  else if(a==="armevent"){S.armed="event";render()}
  else if(a==="disarm"){S.armed=null;render()}
  else if(a==="delevent"){deleteEvent(S.cur)}
  else if(a==="builder"){openBuilder(b.dataset.id||"")}
  else if(a==="badd"){S.builder.rows.push({label:"",type:"text",options:""});render();var nb=document.getElementById("b-l-"+(S.builder.rows.length-1));if(nb)nb.focus()}
  else if(a==="bremove"){S.builder.rows.splice(+b.dataset.i,1);render()}
  else if(a==="bmove"){var i=+b.dataset.i,j=i+(+b.dataset.d),rr=S.builder.rows;if(j>=0&&j<rr.length){var tmp=rr[i];rr[i]=rr[j];rr[j]=tmp;render()}}
  else if(a==="bcancel"){S.panel="";S.builder=null;render()}
  else if(a==="bsave"){
    var bd=S.builder;
    if(!String(bd.title||"").trim()){toast("Give the module a name first");document.getElementById("b-title").focus();return}
    if(!bd.rows.some(function(r){return String(r.label||"").trim()})){toast("Add at least one column with a name");return}
    var id=bd.id;if(id)updateCustomModule(e,id,bd.title,bd.lead,bd.rows);else id=addCustomModule(e,bd.title,bd.lead,bd.rows);
    patchCustom(S.cur);S.panel="";S.builder=null;S.mod=id;remember();render();toast(bd.id?"Module updated":"Module added");
  }
  else if(a==="bdelete"){
    var cid=S.builder.id;if(S.armed!=="cm"+cid){S.armed="cm"+cid;render();return}
    S.armed=null;removeCustomModule(e,cid);var pf={custom:e.custom,modules:e.modules};pf[cid]=[];patch(S.cur,pf);
    S.panel="";S.builder=null;S.mod="overview";render();toast("Custom module deleted");
  }
  else if(a==="libcopy"){var lib=customLibrary(S.events,e)[+b.dataset.i];if(!lib)return;var nid=copyCustomModule(e,lib);patchCustom(S.cur);S.mod=nid;render();toast("Module added from "+lib.from)}
});
document.addEventListener("dragover",function(evt){var d=evt.target.closest&&evt.target.closest("[data-drop]");if(!d||!canUpload())return;evt.preventDefault();d.classList.add("over")});
document.addEventListener("dragleave",function(evt){var d=evt.target.closest&&evt.target.closest("[data-drop]");if(d)d.classList.remove("over")});
document.addEventListener("drop",function(evt){var d=evt.target.closest&&evt.target.closest("[data-drop]");if(!d||!canUpload())return;evt.preventDefault();d.classList.remove("over");var mod=d.dataset.drop==="*"?S.archMod:d.dataset.drop;uploadFiles(evt.dataTransfer&&evt.dataTransfer.files,mod)});
document.addEventListener("keydown",function(evt){if(evt.key==="Escape"&&S.lightbox){S.lightbox=null;renderLightbox()}});
["pause","ended"].forEach(function(n){document.addEventListener(n,function(){if(S.deferRender)setTimeout(safeRender,0)},true)});
function createEvent(data){
  var id="ev-"+rid();
  if(S.mode==="db"){S.db.collection("events").doc(id).set(data).then(function(){toast("Event created")},function(err){
    if(err&&err.code==="quota_exceeded")toast("Storage is full. Delete an old event first.");else if(err&&err.code==="invalid_argument"){S.readOnly=true;toast("You can view but not create events")}else toast("Couldn’t create the event. Try again.");
    delete S.events[id];S.order=S.order.filter(function(x){return x!==id});render()})}
  S.events[id]=normalise(data);if(S.order.indexOf(id)<0)S.order.push(id);S.cur=id;S.mod="overview";S.creating=false;S.panel="";remember();render();
}
function deleteEvent(id){
  S.armed=null;
  if(S.mode==="db"){S.db.collection("events").doc(id).delete().catch(function(){toast("Couldn’t delete. Try again.")})}
  var gone=S.events[id];
  // Files belong to the event: remove them from the store with it.
  if(S.assets&&gone&&gone.archive)gone.archive.forEach(function(f){if(f.assetId)S.assets.delete(f.assetId).catch(function(){})});
  delete S.events[id];S.order=S.order.filter(function(x){return x!==id});S.cur=sortedEvents()[0]||null;S.mod="overview";if(!S.cur)S.panel="home";remember();render();toast("Event deleted");
}

/* ---------- boot ---------- */
function applySnap(snap){
  var seen={};
  snap.docs.forEach(function(d){var data=d.data();if(!data)return;var id=d.id;seen[id]=1;
    var merged=JSON.parse(JSON.stringify(data));Object.assign(merged,S.inflight[id]||{},S.pending[id]||{});
    S.events[id]=normalise(merged)});
  S.order=Object.keys(seen);Object.keys(S.events).forEach(function(id){if(!seen[id]&&!S.pending[id])delete S.events[id]});
  if(!S.events[S.cur])S.cur=sortedEvents()[0]||null;
  var a=document.activeElement;
  if(a&&a.closest&&a.closest("#main")&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="checkbox"))){S.renderOnBlur=true}else safeRender();
}
document.addEventListener("focusout",function(){if(S.renderOnBlur){S.renderOnBlur=false;setTimeout(safeRender,0)}});
function startLocal(){if(S.mode!=="loading")return;S.mode="local";var e=normalise(exampleEvent()),id="ev-local";S.events[id]=e;S.order=[id];S.cur=id;render()}
function boot(){
  if(!window.claude||!window.claude.use){startLocal();return}
  var fallback=setTimeout(startLocal,10500);
  Promise.all([window.claude.use("db"),window.claude.use("user"),window.claude.use("assets"),window.claude.use("downloads")]).then(function(res){
    clearTimeout(fallback);var db=res[0],user=res[1];
    if(!db){startLocal();return}
    S.db=db;S.user=user;S.assets=res[2]||null;S.downloads=res[3]||null;S.mode="db";
    db.doc("site/showcase").onSnapshot(function(snap){S.showcase=snap.exists?snap.data():null;if(!S.showEdit)safeRender()},function(){});
    if(user&&user.can){Promise.resolve(user.can("data.write")).then(function(ok){if(ok===false){S.readOnly=true;render()}}).catch(function(){})}
    var timer=setTimeout(function(){S.stale=true;if(!S.order.length){document.getElementById("main").innerHTML='<div class="empty"><h1>Can’t reach your events yet</h1><p>The shared store isn’t answering. This page keeps trying; your events appear as soon as it does.</p></div>'}else render()},10000);
    db.collection("events").onSnapshot(function(snap){if(!snap.metadata.fromCache){clearTimeout(timer);S.stale=false}applySnap(snap)},function(err){clearTimeout(timer);S.stale=false;if(err&&err.code==="revoked"){S.readOnly=true}render()});
  },function(){clearTimeout(fallback);startLocal()});
}
window.__lib={newEvent:newEvent,exampleEvent:exampleEvent};
boot();
})();
